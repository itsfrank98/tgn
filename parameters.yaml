data: "gab_posts_no_zero_snap0" #"gab_posts_10k_synthetic"
consider_synthetic: True

preprocessing:
  base_dir: "../data/clean_data"    # "/home/francesco/tgn/data/with_synthetic/10k_users"
  output_dir: "../data/preprocess_outputs"
  ext: "tsv"    # file extension, either tsv or csv
  embedding_type: "sonar"
  bipartite: False

load_model: True    # Set it to true for making inference
use_memory: False
ext: "tsv"
features_src: "data/preprocess_outputs"
embedding_type: "sonar"
memory_dim: 10
message_function: "mlp"
negative_sampling_ratio: 2
bs: 1000
prefix: ''
n_degree: 10
n_head: 2
n_epoch: 50
n_layer: 1
lr: 0.0001
patience: 5
n_runs: 1
drop_out: 0.1
gpu: 0
node_dim: 100
time_dim: 100
backprop_every: 1
embedding_module: "graph_attention"
memory_updater: "gru"
aggregator: "last"
memory_update_at_end: False
message_dim: 100
different_new_nodes: False
uniform: False
randomize_features: False
use_destination_embedding_in_message: True
use_source_embedding_in_message: True
dyrep: False


net_analysis:
  real_edges_src: #"data/clean_data/social_network.edg"
  synthetic_edges_src: "filtered_synthetic_edges.pkl" #"connections_2.pkl" #
  compute_metrics: True
  draw_network: True
  mirror_degree_distribution: #True
  threshold: .65

  draw_network_params:
    sample_n_nodes: 795
    group_layout: "circular"

  mirroring_node_degrees_params:
    real_profiles_src: "data/clean_data/stance/stance_mistral_real.csv"
    synthetic_profiles_src: "data/clean_data/synthetic_posts.csv"
    output_edges_path: "filtered_synthetic_edges.pkl"
